<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="752" viewBox="0 0 1640 752" font-family="Segoe UI, Microsoft YaHei, sans-serif"><title>表格问答中程序的语义忠实性</title>
<rect x="0" y="0" width="1640" height="752" rx="0" fill="#ffffff" stroke="none"/>
<rect x="40" y="31" width="45" height="5" rx="2" fill="#007d79" stroke="none"/>
<text x="99" y="40" font-size="17" fill="#386675" font-weight="650" text-anchor="start">TABLE QA   /   MOTIVATION</text>
<text x="1598" y="40" font-size="17" fill="#557080" font-weight="500" text-anchor="end">示意数据 · 2023</text>
<text x="40" y="101" font-size="46" fill="#142f40" font-weight="680" text-anchor="start">同一段程序能回答哪一道题？</text>
<rect x="40" y="143" width="35" height="28" rx="7" fill="#dceded" stroke="none"/>
<text x="57.5" y="163" font-size="16" fill="#086c66" font-weight="700" text-anchor="middle">01</text>
<text x="86" y="165" font-size="25" fill="#163849" font-weight="640" text-anchor="start">输入表格</text>
<rect x="501" y="143" width="35" height="28" rx="7" fill="#dceded" stroke="none"/>
<text x="518.5" y="163" font-size="16" fill="#086c66" font-weight="700" text-anchor="middle">02</text>
<text x="547" y="165" font-size="25" fill="#163849" font-weight="640" text-anchor="start">程序行为</text>
<rect x="985" y="143" width="35" height="28" rx="7" fill="#dceded" stroke="none"/>
<text x="1002.5" y="163" font-size="16" fill="#086c66" font-weight="700" text-anchor="middle">03</text>
<text x="1031" y="165" font-size="25" fill="#163849" font-weight="640" text-anchor="start">用两个问题检验同一程序</text>
<rect x="40" y="188" width="425" height="348" rx="14" fill="#f6f9fa" stroke="#cddadf"/>
<rect x="501" y="188" width="448" height="348" rx="14" fill="#f6f9fa" stroke="#cddadf"/>
<path d="M469 357 L495 357" fill="none" stroke="#738e9c" stroke-width="2.5"/>
<path d="m488 351 7 6 -7 6" fill="none" stroke="#738e9c" stroke-width="2.5"/>
<path d="M953 357 L979 357" fill="none" stroke="#738e9c" stroke-width="2.5"/>
<path d="m972 351 7 6 -7 6" fill="none" stroke="#738e9c" stroke-width="2.5"/>
<text x="63" y="229" font-size="25" fill="#163849" font-weight="650" text-anchor="start">2023 年 · 四个国家</text>
<rect x="57" y="249" width="391" height="55" rx="6" fill="#dce8ec" stroke="none"/>
<text x="69" y="283" font-size="20" fill="#264c61" font-weight="650" text-anchor="start">国家</text>
<text x="265" y="273" font-size="19" fill="#264c61" font-weight="650" text-anchor="end">GDP</text>
<text x="265" y="294" font-size="15" fill="#426475" font-weight="450" text-anchor="end">十亿美元</text>
<text x="436" y="273" font-size="19" fill="#264c61" font-weight="650" text-anchor="end">人口</text>
<text x="436" y="294" font-size="15" fill="#426475" font-weight="450" text-anchor="end">百万人</text>
<text x="69" y="335" font-size="23" fill="#173449" font-weight="400" text-anchor="start">USA</text>
<text x="265" y="335" font-size="23" fill="#163849" font-weight="550" text-anchor="end">27000</text>
<text x="436" y="335" font-size="23" fill="#163849" font-weight="450" text-anchor="end">335</text>
<path d="M65 350 L438 350" fill="none" stroke="#c6d5db" stroke-width="1"/>
<text x="69" y="385" font-size="23" fill="#173449" font-weight="400" text-anchor="start">Norway</text>
<text x="265" y="385" font-size="23" fill="#163849" font-weight="550" text-anchor="end">520</text>
<text x="436" y="385" font-size="23" fill="#163849" font-weight="450" text-anchor="end">5.5</text>
<path d="M65 400 L438 400" fill="none" stroke="#c6d5db" stroke-width="1"/>
<text x="69" y="435" font-size="23" fill="#173449" font-weight="400" text-anchor="start">India</text>
<text x="265" y="435" font-size="23" fill="#163849" font-weight="550" text-anchor="end">3700</text>
<text x="436" y="435" font-size="23" fill="#163849" font-weight="450" text-anchor="end">1420</text>
<path d="M65 450 L438 450" fill="none" stroke="#c6d5db" stroke-width="1"/>
<text x="69" y="485" font-size="23" fill="#173449" font-weight="400" text-anchor="start">Japan</text>
<text x="265" y="485" font-size="23" fill="#163849" font-weight="550" text-anchor="end">4200</text>
<text x="436" y="485" font-size="23" fill="#163849" font-weight="450" text-anchor="end">125</text>
<text x="525" y="229" font-size="24" fill="#163849" font-weight="650" text-anchor="start">模型生成的排序逻辑</text>
<rect x="521" y="248" width="409" height="88" rx="8" fill="#173848" stroke="none"/>
<text x="539" y="280" font-size="21" fill="#e8f3f6" font-weight="400" text-anchor="start" font-family="Consolas, monospace">rows = df[df.Year == 2023]</text>
<text x="539" y="313" font-size="19" fill="#fbe1a3" font-weight="400" text-anchor="start" font-family="Consolas, monospace">i = rows.GDP_Billion_USD.idxmax()</text>
<text x="525" y="367" font-size="21" fill="#39596b" font-weight="450" text-anchor="start">取该行的 Country 值</text>
<path d="M525 394 L925 394" fill="none" stroke="#c6d5db" stroke-width="1"/>
<text x="525" y="432" font-size="21" fill="#426475" font-weight="500" text-anchor="start">运行结果</text>
<text x="525" y="497" font-size="49" fill="#172f42" font-weight="680" text-anchor="start">USA</text>
<rect x="773" y="460" width="151" height="41" rx="20" fill="#deeeea" stroke="none"/>
<text x="848" y="487" font-size="19" fill="#146456" font-weight="620" text-anchor="middle">执行成功</text>
<rect x="985" y="188" width="615" height="144" rx="12" fill="#eff7f4" stroke="#b9d8cf"/>
<rect x="985" y="188" width="6" height="144" rx="3" fill="#408676" stroke="none"/>
<text x="1008" y="221" font-size="18" fill="#246e60" font-weight="650" text-anchor="start">问题 A   ·   与程序一致</text>
<text x="1008" y="261" font-size="27" fill="#173849" font-weight="620" text-anchor="start">2023 年，哪个国家的 GDP 总量最高？</text>
<text x="1008" y="301" font-size="23" fill="#315c54" font-weight="400" text-anchor="start">按 GDP 总量排序，USA 排在第一。</text>
<rect x="985" y="346" width="615" height="190" rx="12" fill="#fdf5eb" stroke="#e4cbb1"/>
<rect x="985" y="346" width="6" height="190" rx="3" fill="#b96827" stroke="none"/>
<text x="1008" y="378" font-size="18" fill="#99521c" font-weight="650" text-anchor="start">问题 B   ·   与程序不一致</text>
<text x="1008" y="418" font-size="27" fill="#173849" font-weight="620" text-anchor="start">2023 年，哪个国家的人均 GDP 最高？</text>
<text x="1008" y="459" font-size="23" fill="#814621" font-weight="600" text-anchor="start">程序遗漏了人口这一分母。</text>
<text x="1008" y="504" font-size="20" fill="#714e32" font-weight="400" text-anchor="start">按人均 GDP 排序，挪威居首（约 9.45 万美元/人）。</text>
<rect x="40" y="566" width="1560" height="153" rx="14" fill="#133545" stroke="none"/>
<rect x="40" y="582" width="6" height="120" rx="3" fill="#58b8a9" stroke="none"/>
<text x="67" y="604" font-size="18" fill="#a5ddd3" font-weight="650" text-anchor="start">科学问题</text>
<text x="67" y="651" font-size="31" fill="#ffffff" font-weight="600" text-anchor="start">在无法获取标准答案时，程序的列依赖、运算关系和中间结果，</text>
<text x="67" y="694" font-size="31" fill="#ffffff" font-weight="600" text-anchor="start">能在多大程度上揭示已成功执行的表格程序对题意的偏离？</text>
</svg>
